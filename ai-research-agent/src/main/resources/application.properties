spring.application.name=ai-research-agent
spring.config.import=optional:secret.properties
server.port=${server.port}



groq.api.key=${groq.api.key}

#google.api.key=${google.api.key}
#google.customsearch.cx=${google.customsearch.cx}
tavily.api.key=${tavily.api.key}

# ===============================
# MySQL Database Configuration
# ===============================
# spring.datasource.url=jdbc:mysql://localhost:3306/ai_research_db?useSSL=false&serverTimezone=UTC
spring.datasource.url=${spring.datasource.url}
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


